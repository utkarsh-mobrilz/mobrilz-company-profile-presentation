<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 400" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="road-surface" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#09143F"/>
      <stop offset="25%" stop-color="#1E3A8A"/>
      <stop offset="60%" stop-color="#2563EB"/>
      <stop offset="85%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>

    <linearGradient id="road-glow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#60A5FA" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#34D399" stop-opacity="0.95"/>
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="road-neon" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#2563EB" flood-opacity="0.25"/>
    </filter>

    <filter id="card-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#09143F" flood-opacity="0.08"/>
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000000" flood-opacity="0.04"/>
    </filter>

    <filter id="pin-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#2563EB" flood-opacity="0.4"/>
    </filter>
  </defs>

  <style>
    .step-pill { font-family:'Plus Jakarta Sans', sans-serif; font-size:10px; font-weight:800; letter-spacing:0.06em; text-transform:uppercase; }
    .step-title { font-family:'Plus Jakarta Sans', sans-serif; font-size:14px; font-weight:800; fill:#09143F; }
    .step-desc { font-family:'Plus Jakarta Sans', sans-serif; font-size:11px; fill:#64748B; line-height:1.45; }
    .station-node { transition: all 0.3s ease; }
    .station-node:hover { transform: scale(1.04); }
  </style>

  <!-- Ground Grid Gridlines for 3D Perspective Depth -->
  <g opacity="0.06" stroke="#09143F" stroke-width="1">
    <line x1="50" y1="360" x2="1050" y2="360"/>
    <line x1="80" y1="280" x2="1020" y2="280"/>
    <line x1="120" y1="200" x2="980" y2="200"/>
    <line x1="160" y1="120" x2="940" y2="120"/>
  </g>

  <!-- 3D Winding Highway Base Ribbon -->
  <!-- 3D Road Thickness / Extrusion Shadow -->
  <path d="M 90 320 
           C 240 330, 260 210, 390 200 
           C 520 190, 500 290, 640 280 
           C 760 270, 750 140, 890 120 
           L 1020 100 
           L 1020 120 
           L 890 140 
           C 750 160, 760 290, 640 300 
           C 500 310, 520 210, 390 220 
           C 260 230, 240 350, 90 340 Z"
        fill="#050C26" opacity="0.6"/>

  <!-- Road Main Surface Ribbon -->
  <path d="M 90 315 
           C 240 325, 260 205, 390 195 
           C 520 185, 500 285, 640 275 
           C 760 265, 750 135, 890 115 
           L 1015 95" 
        fill="none" stroke="url(#road-surface)" stroke-width="38" stroke-linecap="round" stroke-linejoin="round" filter="url(#road-neon)"/>

  <!-- High-Gloss Road Edge Neon Trim -->
  <path d="M 90 298 
           C 240 308, 260 188, 390 178 
           C 520 168, 500 268, 640 258 
           C 760 248, 750 118, 890 98 
           L 1015 78" 
        fill="none" stroke="url(#road-glow)" stroke-width="4" stroke-linecap="round"/>

  <!-- Road Center Dashed Highway Line -->
  <path d="M 90 315 
           C 240 325, 260 205, 390 195 
           C 520 185, 500 285, 640 275 
           C 760 265, 750 135, 890 115 
           L 1015 95" 
        fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-dasharray="14 12" stroke-linecap="round" opacity="0.85"/>

  <!-- Arrow Tip At Road Termination -->
  <polygon points="1015,75 1045,95 1015,115" fill="#06B6D4" filter="url(#pin-glow)"/>

  


  <!-- ==================== 5 STATIONS ==================== -->

  <!-- STATION 01: Discover (x=90, y=315) -> Card Top-Left (x=20, y=140) -->
  <g class="station-node">
    <!-- Pulsing Node Anchor on Road -->
    <circle cx="90" cy="315" r="22" fill="#2563EB" opacity="0.2"/>
    <circle cx="90" cy="315" r="14" fill="#09143F" stroke="#38BDF8" stroke-width="3" filter="url(#pin-glow)"/>
    <circle cx="90" cy="315" r="5" fill="#FFFFFF"/>
    
    <!-- Vertical Pin / Connector -->
    <line x1="90" y1="300" x2="90" y2="245" stroke="#2563EB" stroke-width="2" stroke-dasharray="3 3"/>
    
    <!-- Station Card 01 -->
    <g filter="url(#card-shadow)">
      <rect x="15" y="100" width="195" height="135" rx="14" fill="url(#card-grad)" stroke="#E2E8F0" stroke-width="1.5"/>
      <rect x="15" y="100" width="195" height="4" rx="2" fill="#2563EB"/>
      
      <!-- Icon Badge -->
      <rect x="30" y="116" width="28" height="28" rx="8" fill="#EFF6FF"/>
      <path d="M 40 128 L 43 133 L 49 123" fill="none" stroke="#2563EB" stroke-width="2" stroke-linecap="round"/>
      
      <text x="66" y="132" class="step-pill" fill="#2563EB">01 · DISCOVER</text>
      <text x="30" y="162" class="step-title">Scope &amp; Alignment</text>
      <text x="30" y="182" class="step-desc">Stakeholder interviews,</text>
      <text x="30" y="198" class="step-desc">architecture audit &amp; key</text>
      <text x="30" y="214" class="step-desc">business requirements.</text>
    </g>
  </g>


  <!-- STATION 02: Define (x=390, y=195) -> Card Below (x=280, y=240) -->
  <g class="station-node">
    <!-- Pulsing Node Anchor on Road -->
    <circle cx="390" cy="195" r="22" fill="#2563EB" opacity="0.2"/>
    <circle cx="390" cy="195" r="14" fill="#09143F" stroke="#38BDF8" stroke-width="3" filter="url(#pin-glow)"/>
    <circle cx="390" cy="195" r="5" fill="#FFFFFF"/>
    
    <!-- Connector down -->
    <line x1="390" y1="210" x2="390" y2="245" stroke="#2563EB" stroke-width="2" stroke-dasharray="3 3"/>
    
    <!-- Station Card 02 -->
    <g filter="url(#card-shadow)">
      <rect x="290" y="245" width="200" height="135" rx="14" fill="url(#card-grad)" stroke="#E2E8F0" stroke-width="1.5"/>
      <rect x="290" y="245" width="200" height="4" rx="2" fill="#0284C7"/>
      
      <rect x="305" y="261" width="28" height="28" rx="8" fill="#F0F9FF"/>
      <!-- Blueprint Icon -->
      <rect x="312" y="268" width="14" height="14" fill="none" stroke="#0284C7" stroke-width="1.8" rx="2"/>
      <line x1="312" y1="275" x2="326" y2="275" stroke="#0284C7" stroke-width="1.5"/>

      <text x="342" y="277" class="step-pill" fill="#0284C7">02 · DEFINE</text>
      <text x="305" y="307" class="step-title">System Architecture</text>
      <text x="305" y="327" class="step-desc">Sprint velocity roadmap,</text>
      <text x="305" y="343" class="step-desc">cloud infrastructure stack</text>
      <text x="305" y="359" class="step-desc">&amp; data schema specs.</text>
    </g>
  </g>


  <!-- STATION 03: Design (x=530, y=225) -> Card Top (x=460, y=35) -->
  <g class="station-node">
    <!-- Pulsing Node Anchor on Road -->
    <circle cx="530" cy="225" r="22" fill="#2563EB" opacity="0.2"/>
    <circle cx="530" cy="225" r="14" fill="#09143F" stroke="#38BDF8" stroke-width="3" filter="url(#pin-glow)"/>
    <circle cx="530" cy="225" r="5" fill="#FFFFFF"/>
    
    <!-- Connector Up -->
    <line x1="530" y1="210" x2="530" y2="175" stroke="#2563EB" stroke-width="2" stroke-dasharray="3 3"/>
    
    <!-- Station Card 03 -->
    <g filter="url(#card-shadow)">
      <rect x="440" y="35" width="200" height="135" rx="14" fill="url(#card-grad)" stroke="#BFDBFE" stroke-width="1.8"/>
      <rect x="440" y="35" width="200" height="4" rx="2" fill="#38BDF8"/>
      
      <rect x="455" y="51" width="28" height="28" rx="8" fill="#EFF6FF"/>
      <!-- Figma Pen/Layers Icon -->
      <polygon points="463,71 472,59 475,62 466,74" fill="#2563EB"/>
      
      <text x="492" y="67" class="step-pill" fill="#2563EB">03 · DESIGN</text>
      <text x="455" y="97" class="step-title">Interactive Prototypes</text>
      <text x="455" y="117" class="step-desc">Clickable Figma user flows,</text>
      <text x="455" y="133" class="step-desc">design system tokens &amp;</text>
      <text x="455" y="149" class="step-desc">usability test validation.</text>
    </g>
  </g>


  <!-- STATION 04: Develop (x=730, y=220) -> Card Below (x=670, y=245) -->
  <g class="station-node">
    <!-- Pulsing Node Anchor on Road -->
    <circle cx="730" cy="220" r="22" fill="#2563EB" opacity="0.2"/>
    <circle cx="730" cy="220" r="14" fill="#09143F" stroke="#38BDF8" stroke-width="3" filter="url(#pin-glow)"/>
    <circle cx="730" cy="220" r="5" fill="#FFFFFF"/>
    
    <!-- Connector Down -->
    <line x1="730" y1="235" x2="730" y2="245" stroke="#2563EB" stroke-width="2" stroke-dasharray="3 3"/>
    
    <!-- Station Card 04 -->
    <g filter="url(#card-shadow)">
      <rect x="650" y="245" width="200" height="135" rx="14" fill="url(#card-grad)" stroke="#BFDBFE" stroke-width="1.8"/>
      <rect x="650" y="245" width="200" height="4" rx="2" fill="#2563EB"/>
      
      <rect x="665" y="261" width="28" height="28" rx="8" fill="#EFF6FF"/>
      <!-- Code brackets icon -->
      <path d="M 674 271 L 670 275 L 674 279 M 684 271 L 688 275 L 684 279" fill="none" stroke="#2563EB" stroke-width="2" stroke-linecap="round"/>

      <text x="702" y="277" class="step-pill" fill="#2563EB">04 · DEVELOP</text>
      <text x="665" y="307" class="step-title">Agile Sprints</text>
      <text x="665" y="327" class="step-desc">Bi-weekly sprint demos,</text>
      <text x="665" y="343" class="step-desc">automated CI/CD pipelines</text>
      <text x="665" y="359" class="step-desc">&amp; unit/integration tests.</text>
    </g>
  </g>


  <!-- STATION 05: Deploy &amp; Scale (x=980, y=105) -> Card Top-Right (x=880, y=20) -->
  <g class="station-node">
    <!-- Pulsing Node Anchor on Road -->
    <circle cx="980" cy="105" r="24" fill="#10B981" opacity="0.25"/>
    <circle cx="980" cy="105" r="16" fill="#09143F" stroke="#10B981" stroke-width="3.5" filter="url(#pin-glow)"/>
    <circle cx="980" cy="105" r="6" fill="#10B981"/>
    
    <!-- Rocket Pin / Connector -->
    <line x1="980" y1="90" x2="980" y2="15" stroke="#10B981" stroke-width="2" stroke-dasharray="3 3"/>
    
    <!-- Station Card 05 -->
    <g filter="url(#card-shadow)">
      <rect x="860" y="15" width="210" height="145" rx="14" fill="url(#card-grad)" stroke="#A7F3D0" stroke-width="1.8"/>
      <rect x="860" y="15" width="210" height="4" rx="2" fill="#10B981"/>
      
      <rect x="875" y="31" width="28" height="28" rx="8" fill="#ECFDF5"/>
      <!-- Rocket Icon -->
      <path d="M 885 49 L 892 37 L 897 42 L 891 49 Z" fill="none" stroke="#10B981" stroke-width="2"/>

      <text x="912" y="47" class="step-pill" fill="#10B981">05 · DEPLOY</text>
      <text x="875" y="77" class="step-title">Launch &amp; Scale</text>
      <text x="875" y="97" class="step-desc">Zero-downtime production</text>
      <text x="875" y="113" class="step-desc">rollout, edge CDN tuning,</text>
      <text x="875" y="129" class="step-desc">telemetry &amp; ongoing iteration.</text>
    </g>
  </g>

</svg>
