<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <!-- Linear Gradients for vertical bars -->
    <linearGradient id="bar-grad-1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#2563EB" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="bar-grad-2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#09143F" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="bar-grad-3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7DD3FC" stop-opacity="0.6"/>
      <stop offset="45%" stop-color="#38BDF8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="bar-grad-teal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0EA5E9" stop-opacity="0.5"/>
      <stop offset="70%" stop-color="#2563EB" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <filter id="soft-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <g filter="url(#soft-blur)">
    <!-- Vertical columns hanging from top edge like CoreDeck -->
    <rect x="0" y="0" width="75" height="340" fill="url(#bar-grad-1)"/>
    <rect x="80" y="0" width="85" height="270" fill="url(#bar-grad-3)"/>
    <rect x="170" y="0" width="65" height="380" fill="url(#bar-grad-2)"/>
    <rect x="240" y="0" width="90" height="220" fill="url(#bar-grad-teal)"/>
    <rect x="335" y="0" width="80" height="330" fill="url(#bar-grad-1)"/>
    <rect x="420" y="0" width="100" height="190" fill="url(#bar-grad-3)"/>
    <rect x="525" y="0" width="75" height="310" fill="url(#bar-grad-2)"/>
    <rect x="605" y="0" width="85" height="240" fill="url(#bar-grad-teal)"/>
    <rect x="695" y="0" width="95" height="360" fill="url(#bar-grad-1)"/>
    <rect x="795" y="0" width="70" height="210" fill="url(#bar-grad-3)"/>
    <rect x="870" y="0" width="85" height="320" fill="url(#bar-grad-2)"/>
    <rect x="960" y="0" width="105" height="260" fill="url(#bar-grad-teal)"/>
    <rect x="1070" y="0" width="65" height="390" fill="url(#bar-grad-1)"/>
    <rect x="1140" y="0" width="60" height="300" fill="url(#bar-grad-3)"/>
  </g>
</svg>
